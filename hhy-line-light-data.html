<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜光演变 · 定格运镜</title>
    <script>
      // 向父窗口发送场景信息
      if (window.parent !== window) {
        window.parent.postMessage({
          type: 'SCENE_INFO',
          scene: 'timeline',
          title: '时空演变',
          description: '2012-2023 夜光数据演变'
        }, '*');
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ffff; font-family: sans-serif; font-size: 20px; pointer-events: none;
            opacity: 1; transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="loading">正在初始化...</div>

    <!-- 关键修改：去掉 autoplay，让 JS 控制播放时机 -->
    <video id="video-texture" loop muted crossOrigin="anonymous" playsinline style="display:none">
        <source src="./night_light_change_2012_2023.mp4" type="video/mp4">
    </video>

    <script>
        // === 🎥 运镜参数 ===
        // 初始：高空全貌
        const START_LAT = 35.0;
        const START_LON = 104.0;
        const START_DIST = 16.0;

        // 目标：低空聚焦西部
        const TARGET_LAT = 36.0;
        const TARGET_LON = 95.0;
        const TARGET_DIST = 9.5;

        const EARTH_RADIUS = 5;
        const ROTATION_OFFSET_Y = 4.71;

        let scene, camera, renderer;
        let earthMesh, borderGroup, huLineGroup;
        let videoElement;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            // 1. 创建视频纹理
            videoElement = document.getElementById('video-texture');
            const videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.encoding = THREE.sRGBEncoding;

            // 2. 创建地球
            const geometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
            const material = new THREE.MeshBasicMaterial({ map: videoTexture, color: 0xeeeeee });
            earthMesh = new THREE.Mesh(geometry, material);
            earthMesh.rotation.y = ROTATION_OFFSET_Y;
            scene.add(earthMesh);

            // 3. 加载辅助线
            loadChinaBorder();
            drawHuLine();

            // 4. 设置初始相机位置
            setCameraPos(START_LAT, START_LON, START_DIST);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enablePan = false;

            window.addEventListener('resize', onWindowResize);

            // === 🎬 核心流程控制 ===
            // 等待视频元数据加载完成（确保画面不是黑的）
            if (videoElement.readyState >= 2) {
                startSequence();
            } else {
                videoElement.addEventListener('loadeddata', startSequence);
            }

            animate();
        }

        function startSequence() {
            document.getElementById('loading').style.opacity = 0;

            // 第一步：先手动把视频定在第 0.1 秒（显示初始夜景，不播放）
            videoElement.currentTime = 0.1;

            // 第二步：延迟一点点后，开始运镜
            setTimeout(() => {
                startCameraAnimation();
            }, 500);
        }

        // === 🎥 运镜动画 ===
        function startCameraAnimation() {
            // 计算目标坐标
            const startPos = camera.position.clone();
            const targetPos = getVectorFromLatLon(TARGET_LAT, TARGET_LON, TARGET_DIST);

            new TWEEN.Tween(camera.position)
                .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 3000) // 3秒运镜
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => {
                    camera.lookAt(0, 0, 0); // 始终看向地球中心
                })
                .onComplete(() => {
                    // 第三步：运镜结束后，开始播放视频
                    console.log("运镜到位，开始播放演变...");
                    videoElement.play();
                })
                .start();
        }

        // === 工具函数 ===
        function getVectorFromLatLon(lat, lon, dist) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180) + ROTATION_OFFSET_Y;
            return new THREE.Vector3(
                -(dist) * Math.sin(phi) * Math.cos(theta),
                (dist) * Math.cos(phi),
                (dist) * Math.sin(phi) * Math.sin(theta)
            );
        }

        function setCameraPos(lat, lon, dist) {
            const pos = getVectorFromLatLon(lat, lon, dist);
            camera.position.copy(pos);
            camera.lookAt(0, 0, 0);
        }

        function drawHuLine() {
            huLineGroup = new THREE.Group();
            const heiheLat = 50.24, heiheLon = 127.53;
            const tengLat = 25.02, tengLon = 98.49;
            const start = latLongToVector3(heiheLat, heiheLon, EARTH_RADIUS + 0.03);
            const end = latLongToVector3(tengLat, tengLon, EARTH_RADIUS + 0.03);
            const points = greatCirclePoints(start, end, EARTH_RADIUS + 0.03, 100);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xff3300, linewidth: 3, transparent: true, opacity: 0.9 });
            const line = new THREE.Line(geometry, material);
            huLineGroup.add(line);
            const dotGeo = new THREE.SphereGeometry(0.06, 16, 16);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const dot1 = new THREE.Mesh(dotGeo, dotMat); dot1.position.copy(start);
            const dot2 = new THREE.Mesh(dotGeo, dotMat); dot2.position.copy(end);
            huLineGroup.add(dot1); huLineGroup.add(dot2);
            huLineGroup.rotation.y = earthMesh.rotation.y;
            scene.add(huLineGroup);
        }

        function greatCirclePoints(v1, v2, r, segments) {
            const u1 = v1.clone().normalize(); const u2 = v2.clone().normalize();
            const angle = Math.acos(Math.min(1, Math.max(-1, u1.dot(u2))));
            const sinAngle = Math.sin(angle); const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const w1 = Math.sin((1 - t) * angle) / sinAngle; const w2 = Math.sin(t * angle) / sinAngle;
                points.push(u1.clone().multiplyScalar(w1).add(u2.clone().multiplyScalar(w2)).multiplyScalar(r));
            }
            return points;
        }

        function loadChinaBorder() {
            const loader = new THREE.FileLoader();
            loader.load('./china.json', (data) => {
                try {
                    const jsonData = JSON.parse(data);
                    borderGroup = new THREE.Group();
                    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffdd00, transparent: true, opacity: 0.6 });
                    jsonData.features.forEach(feature => {
                        const geometryData = feature.geometry;
                        const coordinates = geometryData.type === 'MultiPolygon' ? geometryData.coordinates.flat() : geometryData.coordinates;
                        coordinates.forEach(poly => {
                            const points = poly.map(coord => latLongToVector3(coord[1], coord[0], EARTH_RADIUS + 0.01));
                            borderGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), lineMaterial));
                        });
                    });
                    borderGroup.rotation.y = earthMesh.rotation.y;
                    scene.add(borderGroup);
                } catch (e) {}
            });
        }

        function latLongToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(-(radius) * Math.sin(phi) * Math.cos(theta), (radius) * Math.cos(phi), (radius) * Math.sin(phi) * Math.sin(theta));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update(); // 必须调用
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
