<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D地球 · 赛博胡焕庸线</title>

    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Microsoft YaHei', sans-serif; }

        #status, #tips, #score-panel {
            position: absolute; width: 100%; text-align: center; pointer-events: none; z-index: 10;
        }
        #status {
            top: 20px; color: rgba(0, 255, 255, 0.9); font-size: 18px; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.8); font-weight: bold;
        }
        #score-panel {
            top: 60px; color: #ffaa00; font-size: 26px; font-weight: bold; opacity: 0; transition: opacity 0.5s;
            text-shadow: 0 0 15px #ffaa00;
        }
        #tips {
            bottom: 12%; color: #ffd700; font-size: 15px; opacity: 0; transition: opacity 1s; letter-spacing: 1px;
        }

        #webcam-preview {
            position: absolute; bottom: 20px; right: 20px;
            width: 160px; height: 120px;
            transform: scaleX(-1);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 4px;
            z-index: 20; opacity: 0.8;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .hud-label {
            font-family: 'Microsoft YaHei', sans-serif;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 20, 40, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-left: 4px solid #00ffff;
            padding: 6px 14px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            opacity: 0;
            animation: fadeIn 0.5s forwards;
            border-radius: 2px;
        }
        .hud-label.tengchong {
            border-left-color: #ff5500;
            border-color: rgba(255, 85, 0, 0.4);
        }

        .hud-title { font-size: 16px; font-weight: bold; margin-bottom: 2px; display: block; letter-spacing: 1px; text-shadow: 0 0 5px currentColor;}
        .hud-coords { font-size: 11px; color: rgba(200, 200, 200, 0.8); display: block; font-family: monospace;}

        @keyframes fadeIn { to { opacity: 1; } }

        #guide-panel {
            position: absolute; bottom: 30px; left: 30px;
            background: rgba(0, 15, 30, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-left: 3px solid #00ffff;
            padding: 15px; border-radius: 6px;
            color: #eee; font-size: 14px; z-index: 15;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }
        .guide-item { margin-bottom: 8px; display: flex; align-items: center;}
        .k-key { display: inline-block; padding: 2px 8px; border: 1px solid #666; border-radius: 4px; color: #00ffff; font-family: monospace; margin: 0 6px; background: #222; font-weight: bold;}
    </style>
</head>
<body>

    <div id="status">正在初始化全息系统...</div>
    <div id="score-panel"></div>
    <div id="tips">等待指令</div>

    <div id="guide-panel">
        <div class="guide-item">🖐️ 张手旋转 / 🤏 捏合缩放</div>
        <div class="guide-item">✍️ 锁定后 长捏合绘制</div>
        <div class="guide-item"><span class="k-key">D</span> 切换 绘图 / 观察 模式</div>
        <div class="guide-item"><span class="k-key">C</span> 显示 胡焕庸线 (对比)</div>
        <div class="guide-item"><span class="k-key">X</span> 清除 所有数据</div>
    </div>

    <video id="earth-video" muted loop crossOrigin="anonymous" playsinline style="display:none">
        <source src="./earth_video.mp4" type="video/mp4">
    </video>

    <video id="webcam-input" style="display:none"></video>
    <canvas id="webcam-preview"></canvas>

    <script>
    (function() {
        // === 核心参数 ===
        const STOP_TIME = 28.0;
        const OFFSET_X = 0.0;
        const ROTATION_Y = 4.71;
        const TARGET_LAT = 35.0;
        const TARGET_LON = 104.0;

        // === 🏷️ 标签距离配置 ===
        const HEIHE_OFFSET_X = 45;
        const HEIHE_OFFSET_Y = -45;

        const TENG_OFFSET_X = -80;
        const TENG_OFFSET_Y = 65;

        // === 交互参数 ===
        const PINCH_DIST_THRESHOLD = 0.08;
        const PINCH_HOLD_TIME = 300;

        // === 颜色定义 ===
        const COLOR_BORDER = 0x00ffff;
        const COLOR_HEIHE = 0x00ffff;
        const COLOR_TENGCHONG = 0xff5500;
        const COLOR_LINE_CORE = 0xffffff;
        const COLOR_LINE_GLOW = 0xff3300;

        let scene, camera, renderer, css2DRenderer, controls, borderLines;
        let earthMesh = null;
        let isFocusing = false;
        let isDrawingMode = false;

        let drawState = 'idle';
        let startPoint = null;
        let previewLine = null;
        let startMarker = null;
        let cursorMarker = null;
        let pinchStartTime = null;
        let finalLineMesh = null;

        let realHuLineGroup = new THREE.Group();
        let pulseNodes = [];
        let laserLine = null;
        let laserHead = null;
        let laserProgress = 0;
        let isAnimatingLaser = false;

        let userLinePoints = [];
        let labelList = [];

        let raycaster;
        let handPrevX = null, handPrevY = null;

        function init() {
            raycaster = new THREE.Raycaster();
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 16);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            css2DRenderer = new THREE.CSS2DRenderer();
            css2DRenderer.setSize(window.innerWidth, window.innerHeight);
            css2DRenderer.domElement.style.position = 'absolute';
            css2DRenderer.domElement.style.top = '0px';
            css2DRenderer.domElement.style.pointerEvents = 'none';
            document.body.appendChild(css2DRenderer.domElement);

            const video = document.getElementById('earth-video');
            video.play().catch(() => window.addEventListener('click', () => video.play(), { once: true }));
            const videoTexture = new THREE.VideoTexture(video);
            videoTexture.encoding = THREE.sRGBEncoding;
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.wrapS = THREE.RepeatWrapping;
            videoTexture.offset.x = OFFSET_X;

            const geometry = new THREE.SphereGeometry(5, 72, 72);
            const material = new THREE.MeshBasicMaterial({ map: videoTexture, color: 0xcccccc });
            earthMesh = new THREE.Mesh(geometry, material);
            earthMesh.rotation.y = ROTATION_Y;
            scene.add(earthMesh);

            earthMesh.add(realHuLineGroup);

            const cursorMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 });
            cursorMarker = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), cursorMat);
            cursorMarker.visible = false;
            scene.add(cursorMarker);

            const startMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            startMarker = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), startMat);
            startMarker.visible = false;
            scene.add(startMarker);

            loadChinaBorder();
            createAtmosphere();
            createStars();

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enablePan = false;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2.0;
            controls.minDistance = 6.0;
            controls.maxDistance = 40.0;

            initHandTracking();
            initKeyboardEvents();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function initKeyboardEvents() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'd' || e.key === 'D') {
                    if (!isFocusing) {
                        document.getElementById('status').innerText = '⛔ 请等待中国区域锁定...';
                        return;
                    }
                    isDrawingMode = !isDrawingMode;
                    if (isDrawingMode) {
                        clearAllDrawing();
                        document.getElementById('status').innerHTML = '✍️ 绘图模式已激活';
                        document.getElementById('tips').style.opacity = '1';
                        document.getElementById('tips').innerHTML = "长按捏合设定起点，移动手指绘制";
                    } else {
                        exitDrawingMode();
                        document.getElementById('status').innerHTML = '👀 观察模式';
                    }
                }
                if (e.key === 'x' || e.key === 'X') {
                    clearAllDrawing();
                    clearRealHuLine();
                    document.getElementById('score-panel').style.opacity = '0';
                    document.getElementById('status').innerHTML = '🧹 数据已清除';
                }
                if (e.key === 'c' || e.key === 'C') {
                    showRealHuLine();
                    exitDrawingMode();
                    document.getElementById('status').innerHTML = '🟢 正在解析胡焕庸...';
                }
            });
        }

        function exitDrawingMode() {
            isDrawingMode = false;
            if (cursorMarker) cursorMarker.visible = false;
            if (startMarker) startMarker.visible = false;
            if (previewLine) scene.remove(previewLine);
            previewLine = null;
            drawState = 'idle';
            startPoint = null;
        }

        function clearAllDrawing() {
            if (finalLineMesh) scene.remove(finalLineMesh);
            finalLineMesh = null;
            userLinePoints = [];
            drawState = 'idle';
            startPoint = null;
            if (previewLine) scene.remove(previewLine);
            previewLine = null;
            if (startMarker) startMarker.visible = false;
        }

        function clearRealHuLine() {
             while(realHuLineGroup.children.length > 0){
                realHuLineGroup.remove(realHuLineGroup.children[0]);
            }
            removeAllLabels();
            pulseNodes = [];
            laserLine = null;
            laserHead = null;
            isAnimatingLaser = false;
        }

        function removeAllLabels() {
            labelList.forEach(label => {
                if (label.parent) label.parent.remove(label);
            });
            labelList = [];
        }

        function createHUDLabel(title, coords, lat, lon, extraClass = '', offsetX = 0, offsetY = 0) {
            const div = document.createElement('div');
            div.className = 'hud-label ' + extraClass;
            div.innerHTML = `
                <span class="hud-title">${title}</span>
                <span class="hud-coords">${coords}</span>
            `;
            div.style.marginTop = `${offsetY}px`;
            div.style.marginLeft = `${offsetX}px`;

            const label = new THREE.CSS2DObject(div);
            const pos = latLongToVector3(lat, lon, 5.05);
            label.position.copy(pos);
            return label;
        }

        class PulseNode {
            constructor(lat, lon, color = 0x00ffff) {
                this.meshGroup = new THREE.Group();
                const pos = latLongToVector3(lat, lon, 5.02);
                this.meshGroup.position.copy(pos);
                this.meshGroup.lookAt(0,0,0);

                // 核心白点 (球体)
                const coreGeo = new THREE.SphereGeometry(0.06, 16, 16);
                const coreMat = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    depthTest: false,
                    transparent: false
                });
                this.core = new THREE.Mesh(coreGeo, coreMat);
                this.core.renderOrder = 99999;
                this.meshGroup.add(this.core);

                const ringGeo = new THREE.RingGeometry(0.08, 0.09, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending,
                    depthTest: false
                });
                this.ring1 = new THREE.Mesh(ringGeo, ringMat);
                this.meshGroup.add(this.ring1);
                this.ring2 = new THREE.Mesh(ringGeo, ringMat.clone());
                this.meshGroup.add(this.ring2);
                this.time = 0;
            }
            update() {
                this.time += 0.04;
                const s1 = 1 + (this.time % 1.5) * 2.5;
                const o1 = 1 - (this.time % 1.5) / 1.5;
                this.ring1.scale.set(s1, s1, 1);
                this.ring1.material.opacity = o1 * 0.8;
                const t2 = this.time + 0.75;
                const s2 = 1 + (t2 % 1.5) * 2.5;
                const o2 = 1 - (t2 % 1.5) / 1.5;
                this.ring2.scale.set(s2, s2, 1);
                this.ring2.material.opacity = o2 * 0.5;
            }
        }

        function showRealHuLine() {
            clearRealHuLine();

            const heiheLat = 50.24, heiheLon = 127.53;
            const tengLat = 25.02, tengLon = 98.49;
            const heihePos = latLongToVector3(heiheLat, heiheLon, 5.02);
            const tengchongPos = latLongToVector3(tengLat, tengLon, 5.02);

            const nodeHeihe = new PulseNode(heiheLat, heiheLon, COLOR_HEIHE);
            const nodeTengchong = new PulseNode(tengLat, tengLon, COLOR_TENGCHONG);
            realHuLineGroup.add(nodeHeihe.meshGroup);
            realHuLineGroup.add(nodeTengchong.meshGroup);
            pulseNodes.push(nodeHeihe, nodeTengchong);

            const heiheLabel = createHUDLabel('黑河', '50.24°N / 127.53°E', heiheLat, heiheLon, 'heihe', HEIHE_OFFSET_X, HEIHE_OFFSET_Y);
            const tengchongLabel = createHUDLabel('腾冲', '25.02°N / 98.49°E', tengLat, tengLon, 'tengchong', TENG_OFFSET_X, TENG_OFFSET_Y);
            earthMesh.add(heiheLabel);
            earthMesh.add(tengchongLabel);
            labelList.push(heiheLabel, tengchongLabel);

            const points = greatCirclePoints(heihePos, tengchongPos, 5.03, 150);

            // --- 激光线 ---
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);

            // 外发光
            const glowMat = new THREE.LineBasicMaterial({
                color: COLOR_LINE_GLOW,
                linewidth: 8,
                opacity: 0.7,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthTest: false
            });
            const glowLine = new THREE.Line(lineGeo, glowMat);
            glowLine.renderOrder = 9999;

            // 核心白线
            const coreMat = new THREE.LineBasicMaterial({
                color: COLOR_LINE_CORE,
                linewidth: 3,
                opacity: 1.0,
                transparent: true,
                depthTest: false
            });
            const coreLine = new THREE.Line(lineGeo, coreMat);
            coreLine.renderOrder = 9999;

            laserLine = new THREE.Group();
            laserLine.add(glowLine);
            laserLine.add(coreLine);
            realHuLineGroup.add(laserLine);

            glowLine.geometry.setDrawRange(0, 0);
            coreLine.geometry.setDrawRange(0, 0);

            const headGeo = new THREE.SphereGeometry(0.06, 16, 16);
            const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
            laserHead = new THREE.Mesh(headGeo, headMat);
            laserHead.renderOrder = 9999;
            laserHead.visible = false;
            realHuLineGroup.add(laserHead);

            laserProgress = 0;
            isAnimatingLaser = true;

            if (finalLineMesh) {
                const score = calculateSimilarity();
                const scorePanel = document.getElementById('score-panel');
                scorePanel.innerHTML = `匹配度：<span style="font-size:36px; color:#fff">${score}%</span>`;
                scorePanel.style.opacity = '1';
            }
        }

        function greatCirclePoints(v1, v2, r, segments) {
            const u1 = v1.clone().normalize();
            const u2 = v2.clone().normalize();
            const angle = Math.acos(Math.min(1, Math.max(-1, u1.dot(u2))));
            const sinAngle = Math.sin(angle);
            const points = [];
            if (sinAngle < 0.001) return [v1.clone(), v2.clone()];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const w1 = Math.sin((1 - t) * angle) / sinAngle;
                const w2 = Math.sin(t * angle) / sinAngle;
                points.push(u1.clone().multiplyScalar(w1).add(u2.clone().multiplyScalar(w2)).multiplyScalar(r));
            }
            return points;
        }

        function focusOnChina() {
            if (isFocusing) return;
            isFocusing = true;
            document.getElementById('earth-video').pause();
            document.getElementById('status').innerText = '🇨🇳 目标锁定：中国';
            document.getElementById('tips').style.opacity = 1;
            controls.enabled = false;
            controls.autoRotate = false;

            const targetRot = { x: 0, y: ROTATION_Y, z: 0 };
            const targetCamPos = latLongToVector3(TARGET_LAT, TARGET_LON, 9)
                .applyEuler(new THREE.Euler(targetRot.x, targetRot.y, targetRot.z));

            new TWEEN.Tween(earthMesh.rotation).to(targetRot, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => { if(borderLines) borderLines.rotation.copy(earthMesh.rotation); })
                .start();

            new TWEEN.Tween(camera.position).to({ x: targetCamPos.x, y: targetCamPos.y, z: targetCamPos.z }, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => camera.lookAt(0,0,0))
                .start();

            new TWEEN.Tween(earthMesh.material.color).to({r:0.25, g:0.25, b:0.25}, 1500).start();
            if(borderLines) borderLines.children.forEach(l => new TWEEN.Tween(l.material).to({opacity:0.9}, 1500).start());
        }

        function createFinalArc(p1, p2) {
            userLinePoints = [p1.clone(), p2.clone()];
            const points = greatCirclePoints(p1, p2, 5.02, 60);
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeo = new THREE.TubeGeometry(curve, points.length * 2, 0.025, 8, false);
            const material = new THREE.MeshStandardMaterial({
                color: 0xff5500, emissive: 0x442200, roughness: 0.3, metalness: 0.1, transparent: true, opacity: 0.6, side: THREE.DoubleSide
            });
            const line = new THREE.Mesh(tubeGeo, material);
            scene.add(line);
            return line;
        }

        function updatePreviewArc(current) {
            if (!startPoint) return;
            if (previewLine) scene.remove(previewLine);
            const points = greatCirclePoints(startPoint, current, 5.02, 30);
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeo = new THREE.TubeGeometry(curve, points.length * 2, 0.02, 6, false);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 });
            previewLine = new THREE.Mesh(tubeGeo, material);
            scene.add(previewLine);
        }

        // === 核心修改：全新评分算法 ===
        function calculateSimilarity() {
            if (userLinePoints.length < 2) return 0;

            // 1. 获取真实坐标（世界坐标系，因为地球可能旋转了）
            // 我们需要计算 "此刻" 黑河和腾冲在世界空间的位置
            const rS = latLongToVector3(50.24, 127.53, 5.0).applyMatrix4(earthMesh.matrixWorld);
            const rE = latLongToVector3(25.02, 98.49, 5.0).applyMatrix4(earthMesh.matrixWorld);

            // 2. 获取用户点击坐标（Raycaster返回的已经是世界坐标）
            const uS = userLinePoints[0];
            const uE = userLinePoints[1];

            // 3. 计算距离误差（双向检测：S->S, E->E 或者 S->E, E->S）
            const dist1 = rS.distanceTo(uS) + rE.distanceTo(uE);
            const dist2 = rS.distanceTo(uE) + rE.distanceTo(uS);

            // 取最小的误差值
            const totalError = Math.min(dist1, dist2);

            // 4. 指数衰减评分公式 (Exponential Decay)
            // 容差系数：数值越大，评分越宽松。
            // 2.5 的容差意味着即使偏离了1.0个单位（其实在地球上已经很远了），也能拿到约 67分。
            const tolerance = 2.5;

            let score = 100 * Math.exp( -totalError / tolerance );

            // 修正范围并取整
            return Math.min(100, Math.max(0, Math.round(score)));
        }

        function latLongToVector3(lat, lon, radius) {
            const phi = (90 - lat) * Math.PI / 180;
            const theta = (lon + 180) * Math.PI / 180;
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        function loadChinaBorder() {
            new THREE.FileLoader().load('./china.json', (data) => {
                try {
                    const json = JSON.parse(data);
                    const group = new THREE.Group();
                    const mat = new THREE.LineBasicMaterial({ color: COLOR_BORDER, transparent: true, opacity: 0 });
                    json.features.forEach(f => {
                        const coords = f.geometry.coordinates;
                        (f.geometry.type==="Polygon"?[coords[0]]:coords.map(p=>p[0])).forEach(poly => {
                             const pts = poly.map(c => latLongToVector3(c[1], c[0], 5.02));
                             group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
                        });
                    });
                    scene.add(group);
                    group.rotation.copy(earthMesh.rotation);
                    borderLines = group;
                } catch(e){}
            });
        }

        function createAtmosphere() {
            const geo = new THREE.SphereGeometry(5.2, 64, 64);
            const mat = new THREE.ShaderMaterial({
                transparent: true, side: THREE.BackSide,
                vertexShader: `varying vec3 vNormal; void main(){vNormal=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
                fragmentShader: `varying vec3 vNormal; void main(){float i=pow(0.55-dot(vNormal,vec3(0,0,1)),3.0);gl_FragColor=vec4(0.0,0.8,1.0,1.0)*i;}`
            });
            scene.add(new THREE.Mesh(geo, mat));
        }

        function createStars() {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(5000 * 3);
            for(let i=0; i<15000; i++) pos[i] = (Math.random()-0.5)*900;
            geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
            scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color:0xaaaaaa, size:0.3})));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            css2DRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();

            pulseNodes.forEach(n => n.update());

            if (isAnimatingLaser && laserLine) {
                laserProgress += 0.015;
                const totalPoints = laserLine.children[0].geometry.attributes.position.count;
                const currentDrawCount = Math.floor(laserProgress * totalPoints);
                const drawRangeEnd = Math.min(currentDrawCount, totalPoints);

                laserLine.children[0].geometry.setDrawRange(0, drawRangeEnd);
                laserLine.children[1].geometry.setDrawRange(0, drawRangeEnd);

                if (currentDrawCount < totalPoints) {
                    const pos = laserLine.children[0].geometry.attributes.position.array;
                    laserHead.visible = true;
                    laserHead.position.set(
                        pos[currentDrawCount * 3],
                        pos[currentDrawCount * 3 + 1],
                        pos[currentDrawCount * 3 + 2]
                    );
                } else {
                    laserHead.visible = false;
                    isAnimatingLaser = false;
                }
            }

            renderer.render(scene, camera);
            css2DRenderer.render(scene, camera);

            const v = document.getElementById('earth-video');
            if (v && v.currentTime >= STOP_TIME && !isFocusing) focusOnChina();
        }

        function initHandTracking() {
            const videoElement = document.getElementById('webcam-input');
            const canvasElement = document.getElementById('webcam-preview');
            const canvasCtx = canvasElement.getContext('2d');
            const statusDiv = document.getElementById('status');

            function onResults(results) {
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    const middleTip = landmarks[12];

                    // 宽松判断捏合
                    const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                    const isPinchingNow = dist < PINCH_DIST_THRESHOLD;

                    const ix = indexTip.x * canvasElement.width;
                    const iy = indexTip.y * canvasElement.height;
                    const tx = thumbTip.x * canvasElement.width;
                    const ty = thumbTip.y * canvasElement.height;
                    const mx = middleTip.x * canvasElement.width;
                    const my = middleTip.y * canvasElement.height;
                    const palmX = mx;
                    const palmY = my + 20;

                    if (isPinchingNow) {
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(ix, iy);
                        canvasCtx.lineTo(tx, ty);
                        canvasCtx.lineWidth = 4;
                        canvasCtx.strokeStyle = '#ff5500';
                        canvasCtx.stroke();
                    } else {
                        if (!isFocusing) {
                            canvasCtx.font = "40px Arial";
                            canvasCtx.textAlign = "center";
                            canvasCtx.fillText("🖐️", palmX, palmY);
                        } else if (isDrawingMode) {
                            canvasCtx.beginPath();
                            canvasCtx.moveTo(ix, iy);
                            canvasCtx.lineTo(tx, ty);
                            canvasCtx.lineWidth = 2;
                            canvasCtx.strokeStyle = '#00ffaa';
                            canvasCtx.stroke();
                        }
                    }

                    const ndcX = 1 - (indexTip.x * 2);
                    const ndcY = -(indexTip.y * 2) + 1;
                    raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
                    const intersects = raycaster.intersectObject(earthMesh);
                    const hit = intersects.length > 0 ? intersects[0].point : null;

                    if (isDrawingMode && isFocusing) {
                        if (hit) {
                            cursorMarker.position.copy(hit);
                            cursorMarker.visible = true;
                        } else {
                            cursorMarker.visible = false;
                        }

                        if (hit) {
                            if (drawState === 'idle') {
                                if (isPinchingNow) {
                                    if (pinchStartTime === null) pinchStartTime = Date.now();
                                    else if (Date.now() - pinchStartTime > PINCH_HOLD_TIME) {
                                        startPoint = hit.clone();
                                        startMarker.position.copy(startPoint);
                                        startMarker.visible = true;
                                        drawState = 'dragging';
                                        statusDiv.innerHTML = '<span style="color:#00ffff">↔️ 移动手指绘制，松开完成</span>';
                                        pinchStartTime = null;
                                    }
                                } else { pinchStartTime = null; }
                            } else if (drawState === 'dragging') {
                                if (isPinchingNow) {
                                    updatePreviewArc(hit);
                                } else {
                                    if (startPoint && startPoint.distanceTo(hit) > 0.2) {
                                        const newArc = createFinalArc(startPoint, hit);
                                        if (finalLineMesh) scene.remove(finalLineMesh);
                                        finalLineMesh = newArc;
                                        document.getElementById('score-panel').style.opacity = '0';
                                    }
                                    if (previewLine) scene.remove(previewLine);
                                    previewLine = null;
                                    startMarker.visible = false;
                                    cursorMarker.visible = false;
                                    startPoint = null;
                                    drawState = 'idle';
                                    statusDiv.innerHTML = '🎯 绘制完成，按 C 键对比';
                                }
                            }
                        } else {
                            if (drawState === 'dragging') {
                                if (previewLine) scene.remove(previewLine);
                                previewLine = null;
                                startMarker.visible = false;
                                startPoint = null;
                                drawState = 'idle';
                                statusDiv.innerHTML = '🎯 绘制取消（移出地球）';
                            }
                        }
                    }
                    else if (!isFocusing) {
                        cursorMarker.visible = false;
                        if (isPinchingNow) {
                            if (handPrevY !== null) {
                                const deltaY = indexTip.y - handPrevY;
                                const zoomSpeed = 40.0;
                                let newZ = camera.position.z + deltaY * zoomSpeed;
                                newZ = Math.max(controls.minDistance, Math.min(newZ, controls.maxDistance));
                                camera.position.z = newZ;
                            }
                            statusDiv.innerText = '🔍 缩放中 (上移放大/下移缩小)';
                        } else {
                            if (handPrevX !== null && handPrevY !== null) {
                                const deltaX = indexTip.x - handPrevX;
                                const deltaY = indexTip.y - handPrevY;
                                earthMesh.rotation.y += deltaX * 5.0;
                                earthMesh.rotation.x += deltaY * 5.0;
                                earthMesh.rotation.x = Math.max(-0.8, Math.min(0.8, earthMesh.rotation.x));
                                if (borderLines) {
                                    borderLines.rotation.y = earthMesh.rotation.y;
                                    borderLines.rotation.x = earthMesh.rotation.x;
                                }
                            }
                            statusDiv.innerText = '🖐️ 手掌控制旋转';
                        }
                    }
                    handPrevX = indexTip.x;
                    handPrevY = indexTip.y;

                } else {
                    if (!isFocusing) {
                        controls.autoRotate = true;
                        statusDiv.innerText = '🌍 自动巡航中';
                    }
                    handPrevX = null;
                    handPrevY = null;
                    pinchStartTime = null;
                    cursorMarker.visible = false;
                }
                canvasCtx.restore();
            }

            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            hands.onResults(onResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => { await hands.send({ image: videoElement }); },
                width: 320, height: 240
            });
            cameraUtils.start();
        }

        window.onload = init;
    })();
    </script>
</body>
